name: Test vendor

# Runs the canonical suite against one vendor, signs the result, and opens a
# pull request. It never commits to main directly.
#
# The PR is the human review gate. A FAIL is a permanent public statement about
# a named company, so nothing publishes until a person has looked at the
# evidence and merged. Passing and inconclusive runs go through the same path,
# because a single publish route is easier to reason about than two.
#
# Ordering matters and is load-bearing:
#   run suite  →  result file exists
#   attest     →  signs THAT file's digest
#   commit     →  the attested bytes, unmodified
# Any step that rewrites the file after attestation invalidates the signature.

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor slug (must match vendors/<slug>.json)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # Required by actions/attest for Sigstore keyless signing via GitHub OIDC.
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify the suite itself before trusting it against a vendor
        # The fixture pairs prove each assertion still separates a correct
        # provider from a broken one. A regression here would publish wrong
        # verdicts about real companies, so it blocks the run.
        run: bun test

      - name: Run the canonical suite
        id: suite
        env:
          # One secret per vendor, named for the slug. Never echoed, never written
          # to the result file, never committed.
          SOFTRUTH_TOKEN_REFERENCE: ${{ secrets.SOFTRUTH_TOKEN_REFERENCE }}

          # Without this the inbox falls through to UnconfiguredInbox and every
          # delivery assertion reports INCONCLUSIVE. That is the correct behaviour
          # (an assertion we cannot run must look unrunnable, never failed) but it
          # silently produces a record that proves almost nothing, which is how the
          # first CI run came back 2 passed and 4 inconclusive.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          # The domain is recorded in every result, so CI and local runs must agree
          # on it or the same vendor produces records that cannot be compared.
          SOFTRUTH_INBOX_DOMAIN: ${{ vars.SOFTRUTH_INBOX_DOMAIN }}
          SOFTRUTH_BOUNCE_DOMAIN: ${{ vars.SOFTRUTH_BOUNCE_DOMAIN }}
        run: bun run suite/run.ts --vendor "${{ inputs.vendor }}"

      - name: Attest the result
        # Signs the exact bytes of the result file. On a public repo this uses
        # the public-good Sigstore instance, so the signature lands in the Rekor
        # transparency log automatically and nobody, including us, can quietly
        # remove or alter the entry afterwards.
        id: attest
        uses: actions/attest@v3
        with:
          subject-path: ${{ steps.suite.outputs.result_path }}
          predicate-type: https://softruth.dev/predicate/run/v1
          predicate: '{"specVersion":"transactional-email/v1","seed":"${{ steps.suite.outputs.seed }}"}'

      - name: Record the attestation alongside the result
        # actions/attest signs an artifact digest, not the commit. Without the
        # digest and bundle recorded next to the result, a verifier has no way to
        # connect the published JSON to its Rekor entry.
        run: |
          set -euo pipefail
          RESULT='${{ steps.suite.outputs.result_path }}'
          DIGEST="sha256:$(sha256sum "$RESULT" | cut -d' ' -f1)"
          BUNDLE='${{ steps.attest.outputs.bundle-path }}'

          # Written as a sibling file so the result bytes stay exactly as attested.
          jq -n \
            --arg digest "$DIGEST" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --argjson bundle "$(cat "$BUNDLE")" \
            '{artifactDigest:$digest, workflowRunUrl:$url, commit:$commit, bundle:$bundle}' \
            > "${RESULT%.json}.attestation.json"

          echo "attested $DIGEST"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_REVIEW: ${{ steps.suite.outputs.needs_review }}
          SUMMARY: ${{ steps.suite.outputs.summary }}
          VENDOR: ${{ inputs.vendor }}
        run: |
          set -euo pipefail
          BRANCH="result/${VENDOR}-${GITHUB_RUN_ID}"
          git config user.name "softruth-ci"
          git config user.email "ci@softruth.dev"
          git checkout -b "$BRANCH"
          git add results/
          git commit -m "result(${VENDOR}): ${SUMMARY}"
          git push -u origin "$BRANCH"

          if [ "$NEEDS_REVIEW" = "true" ]; then
            REVIEW_NOTE=$'## Human review required\n\nThis run contains a FAIL. A failure is a permanent public statement about a named company. Before merging, confirm from the artifacts that the product actually failed and that our harness did not.'
          else
            REVIEW_NOTE=$'## No failures\n\nNothing in this run blames the vendor. Merging publishes the record as-is.'
          fi

          gh pr create \
            --title "result(${VENDOR}): ${SUMMARY}" \
            --body "${REVIEW_NOTE}"$'\n\n''Seed: `'"${{ steps.suite.outputs.seed }}"$'`\nWorkflow run: '"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
