name: Build site

# Builds the public record into static HTML.
#
# Builds and publishes to GitHub Pages. The published site is the only thing a
# non-technical reader can look at: everything else in this repo is code, an API,
# or a JSON record.

on:
  push:
    branches: [main]
    paths:
      - "explorations/**"
      - "site/**"
      # The build imports the reading rules from mcp/, and the gate below runs
      # mcp/'s tests, so a change anywhere in there should rebuild the site.
      - "mcp/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deploy at a time; a newer build should win rather than queue behind an
  # older one that is about to be wrong.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify the render rules before publishing anything
        # The site and the MCP server share their verdict logic. If a human and
        # an assistant could show different answers about the same product, the
        # record is worthless, so the tests that pin that agreement gate the build.
        run: bun test site/ mcp/ suite/

      - name: Build
        # llms.txt advertises the remote MCP endpoint only when one is actually
        # running. An address in llms.txt that does not answer teaches a reading
        # agent that the register is broken, so the variable stays unset until
        # the endpoint is deployed.
        env:
          SOFTRUTH_MCP_URL: ${{ vars.SOFTRUTH_MCP_URL }}
        run: bun run site/build.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
